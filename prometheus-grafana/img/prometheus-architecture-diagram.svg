<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Prometheus architecture and metric flow</title>
  <desc id="description">Applications expose metrics through exporters. Prometheus discovers targets, scrapes metrics, and stores them in its time series database. Grafana queries Prometheus for dashboards, and alerts are sent to Alertmanager. Short-lived batch jobs can push metrics to Pushgateway for Prometheus to scrape.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2878c8"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e58a24"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7956b3"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #243247; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #52647a; }
      .card-title { font-size: 19px; font-weight: 700; }
      .card-copy { font-size: 14px; fill: #43546a; }
      .small { font-size: 13px; fill: #43546a; }
      .label { font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="20" fill="#f5f8fc"/>
  <text x="44" y="52" class="title">Prometheus architecture</text>
  <text x="44" y="80" class="subtitle">Collect metrics → store them → query dashboards and send alerts</text>

  <!-- Service discovery tells Prometheus which targets to scrape. -->
  <rect x="474" y="110" width="270" height="78" rx="16" fill="#e9e2f6" stroke="#7956b3" stroke-width="2"/>
  <circle cx="505" cy="149" r="17" fill="#7956b3"/>
  <path d="M497 149h16M505 141v16" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="532" y="145" class="card-title">Service discovery</text>
  <text x="532" y="167" class="small">Finds monitoring targets</text>
  <path d="M609 189v48" fill="none" stroke="#7956b3" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <text x="620" y="219" class="small">target list</text>

  <!-- Application and exporter. -->
  <rect x="42" y="286" width="205" height="128" rx="18" fill="#e3f4ea" stroke="#31945d" stroke-width="2"/>
  <circle cx="76" cy="323" r="17" fill="#31945d"/>
  <path d="M68 324h16M76 316v16" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="103" y="324" class="card-title">Application</text>
  <text x="62" y="361" class="card-copy">Creates metrics such as</text>
  <text x="62" y="383" class="card-copy">requests and response time</text>

  <rect x="312" y="286" width="205" height="128" rx="18" fill="#fff0d9" stroke="#e58a24" stroke-width="2"/>
  <circle cx="346" cy="323" r="17" fill="#e58a24"/>
  <path d="M338 323h16M346 315v16" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="373" y="324" class="card-title">Exporter</text>
  <text x="332" y="361" class="card-copy">Makes metrics available</text>
  <text x="332" y="383" class="card-copy">at a /metrics endpoint</text>
  <path d="M247 350h59" fill="none" stroke="#31945d" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="248" y="337" class="small">exposes metrics</text>

  <!-- Prometheus server and its built-in TSDB. -->
  <rect x="587" y="251" width="280" height="220" rx="20" fill="#e2f2fb" stroke="#2878c8" stroke-width="3"/>
  <circle cx="625" cy="291" r="20" fill="#2878c8"/>
  <path d="M615 294c4-12 16-12 20 0M618 299h14" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="658" y="297" class="card-title">Prometheus server</text>
  <text x="611" y="334" class="card-copy">Scrapes targets and evaluates rules</text>
  <rect x="611" y="356" width="232" height="84" rx="12" fill="#fff" stroke="#9ac8e5" stroke-width="1.5"/>
  <path d="M634 376h22v12h-22zM634 392h22v12h-22zM634 408h22v12h-22z" fill="#94c6e2"/>
  <text x="669" y="390" class="label">TSDB</text>
  <text x="669" y="411" class="small">Stores timestamped metrics</text>

  <!-- Scrape request and metrics response are drawn separately to show pull. -->
  <path d="M587 321H525" fill="none" stroke="#2878c8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="525" y="304" class="label" fill="#2878c8">scrape request</text>
  <path d="M517 379H579" fill="none" stroke="#31945d" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="525" y="402" class="label" fill="#31945d">metrics</text>

  <!-- Grafana queries Prometheus and displays the result. -->
  <rect x="958" y="250" width="202" height="132" rx="18" fill="#fce8df" stroke="#dc6a36" stroke-width="2"/>
  <circle cx="994" cy="288" r="17" fill="#dc6a36"/>
  <path d="M986 296v-8h5v8M994 296v-14h5v14M1002 296v-11h5v11" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="1022" y="294" class="card-title">Grafana</text>
  <text x="978" y="333" class="card-copy">Builds dashboards</text>
  <text x="978" y="355" class="card-copy">from Prometheus data</text>
  <path d="M867 300h82" fill="none" stroke="#2878c8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="871" y="283" class="label" fill="#2878c8">PromQL query</text>
  <path d="M949 354h-74" fill="none" stroke="#31945d" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="882" y="376" class="small" fill="#31945d">query results</text>

  <!-- Alert path. -->
  <rect x="958" y="458" width="202" height="112" rx="18" fill="#fde7e8" stroke="#d64c59" stroke-width="2"/>
  <circle cx="994" cy="495" r="17" fill="#d64c59"/>
  <path d="M994 485v12M994 503v1" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="1022" y="501" class="card-title">Alertmanager</text>
  <text x="978" y="538" class="card-copy">Groups and routes alerts</text>
  <path d="M828 471C866 510 907 514 949 514" fill="none" stroke="#d64c59" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="860" y="492" class="label" fill="#d64c59">firing alert</text>
  <rect x="958" y="608" width="202" height="68" rx="16" fill="#fff" stroke="#d8a2a5" stroke-width="2"/>
  <text x="1059" y="638" text-anchor="middle" class="label">Email · chat · on-call</text>
  <text x="1059" y="658" text-anchor="middle" class="small">notification receivers</text>
  <path d="M1059 571v29" fill="none" stroke="#d64c59" stroke-width="3" marker-end="url(#arrow-orange)"/>

  <!-- Optional Pushgateway route for short-lived batch jobs. -->
  <rect x="42" y="536" width="205" height="98" rx="18" fill="#f0ebfb" stroke="#7956b3" stroke-width="2"/>
  <text x="62" y="574" class="card-title">Batch job</text>
  <text x="62" y="599" class="card-copy">May finish before a scrape</text>
  <rect x="312" y="536" width="205" height="98" rx="18" fill="#f0ebfb" stroke="#7956b3" stroke-width="2"/>
  <text x="332" y="574" class="card-title">Pushgateway</text>
  <text x="332" y="599" class="card-copy">Temporarily holds pushed metrics</text>
  <path d="M247 585h59" fill="none" stroke="#7956b3" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <text x="247" y="571" class="small" fill="#7956b3">pushes metrics</text>
  <path d="M587 444C556 494 534 586 525 586" fill="none" stroke="#2878c8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="534" y="514" class="small" fill="#2878c8">Prometheus scrapes</text>

  <rect x="42" y="687" width="16" height="16" rx="4" fill="#2878c8"/>
  <text x="66" y="700" class="small">Prometheus pulls metrics from targets (normal flow)</text>
  <rect x="453" y="687" width="16" height="16" rx="4" fill="#7956b3"/>
  <text x="477" y="700" class="small">Batch jobs push to Pushgateway (special case)</text>
</svg>
