<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title description">
  <title id="title">Grafana and Prometheus architecture</title>
  <desc id="description">Applications expose metrics to Prometheus, which scrapes and stores them. Grafana queries Prometheus, turns the results into dashboards, and serves them to a user's browser.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2878c8"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#31945d"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc6a36"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #243247; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #52647a; }
      .card-title { font-size: 20px; font-weight: 700; }
      .card-copy { font-size: 15px; fill: #43546a; }
      .small { font-size: 13px; fill: #43546a; }
      .label { font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="680" rx="20" fill="#f5f8fc"/>
  <text x="44" y="52" class="title">How Grafana works with Prometheus</text>
  <text x="44" y="80" class="subtitle">Prometheus collects and stores metrics; Grafana queries and visualizes them.</text>

  <rect x="50" y="250" width="230" height="148" rx="20" fill="#e3f4ea" stroke="#31945d" stroke-width="2"/>
  <circle cx="92" cy="295" r="20" fill="#31945d"/>
  <path d="M82 296h20M92 286v20" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="124" y="302" class="card-title">Applications</text>
  <text x="74" y="342" class="card-copy">Expose metrics such as</text>
  <text x="74" y="366" class="card-copy">requests, CPU, and latency</text>

  <rect x="365" y="215" width="270" height="218" rx="20" fill="#e2f2fb" stroke="#2878c8" stroke-width="3"/>
  <circle cx="408" cy="262" r="21" fill="#2878c8"/>
  <path d="M397 264c4-13 18-13 22 0M400 271h16" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="443" y="269" class="card-title">Prometheus</text>
  <text x="390" y="312" class="card-copy">1. Scrapes metric endpoints</text>
  <text x="390" y="340" class="card-copy">2. Stores time-series data</text>
  <rect x="390" y="365" width="220" height="44" rx="10" fill="#fff" stroke="#9ac8e5" stroke-width="1.5"/>
  <text x="500" y="393" text-anchor="middle" class="label">PromQL query API</text>

  <rect x="725" y="215" width="240" height="218" rx="20" fill="#fce8df" stroke="#dc6a36" stroke-width="2"/>
  <circle cx="768" cy="262" r="21" fill="#dc6a36"/>
  <path d="M758 272v-11h7v11M768 272v-20h7v20M778 272v-15h7v15" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="802" y="269" class="card-title">Grafana</text>
  <text x="750" y="312" class="card-copy">Queries Prometheus</text>
  <text x="750" y="340" class="card-copy">Builds dashboard panels</text>
  <rect x="750" y="365" width="190" height="44" rx="10" fill="#fff" stroke="#edb49a" stroke-width="1.5"/>
  <text x="845" y="393" text-anchor="middle" class="label">Dashboard</text>

  <rect x="1020" y="250" width="145" height="148" rx="20" fill="#eee8fa" stroke="#7956b3" stroke-width="2"/>
  <rect x="1057" y="278" width="70" height="48" rx="5" fill="#fff" stroke="#7956b3" stroke-width="2"/>
  <path d="M1065 315l15-14 12 8 19-20" fill="none" stroke="#7956b3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1092 326v12M1078 338h28" stroke="#7956b3" stroke-width="3" stroke-linecap="round"/>
  <text x="1092" y="370" text-anchor="middle" class="card-title">Browser</text>
  <text x="1092" y="389" text-anchor="middle" class="small">User views panels</text>

  <path d="M280 325h77" fill="none" stroke="#2878c8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="292" y="305" class="label" fill="#2878c8">scrapes metrics</text>

  <path d="M725 305h-82" fill="none" stroke="#2878c8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="645" y="284" class="label" fill="#2878c8">PromQL request</text>
  <path d="M643 356h82" fill="none" stroke="#31945d" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="645" y="380" class="small" fill="#31945d">query results</text>

  <path d="M965 325h47" fill="none" stroke="#dc6a36" stroke-width="3" marker-end="url(#arrow-orange)"/>
  <text x="963" y="304" class="label" fill="#dc6a36">serves dashboard</text>
  <path d="M1013 370h-47" fill="none" stroke="#7956b3" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow-orange)"/>
  <text x="964" y="397" class="small">browser request</text>

  <rect x="50" y="500" width="1100" height="104" rx="16" fill="#fff" stroke="#d7e0eb" stroke-width="1.5"/>
  <text x="78" y="537" class="card-title">Remember</text>
  <text x="78" y="570" class="card-copy">Prometheus is the metrics store and query engine. Grafana connects to it as a data source and presents the results.</text>
  <text x="78" y="590" class="small">Configure the Prometheus URL from the Grafana server's point of view—not the browser's.</text>
</svg>
