<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #475569; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1e293b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-sm { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #334155; }
      .text-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 11px; fill: #0f172a; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; }
    </style>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" fill="#f8fafc" />

  <!-- Title Header -->
  <rect x="30" y="25" width="6" height="42" fill="url(#headerGrad)" rx="3" />
  <text x="48" y="44" class="title">Secrets Security, Environments &amp; Context Evaluation</text>
  <text x="48" y="63" class="subtitle">Multi-tier secrets isolation, environment protection gates, and expression context variables</text>

  <!-- COLUMN 1: Secrets & Security Hierarchy -->
  <g transform="translate(30, 85)">
    <rect width="460" height="505" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect width="460" height="42" rx="10" fill="#fef2f2" />
    <path d="M 0 32 L 0 42 L 460 42 L 460 32 Z" fill="#fef2f2" />
    <circle cx="24" cy="21" r="10" fill="#ef4444" />
    <text x="24" y="25" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">&#128274;</text>
    <text x="44" y="26" class="section-title">Secrets Hierarchy &amp; Masking</text>

    <!-- Secrets Tier 1: Org -->
    <g transform="translate(15, 52)">
      <rect width="430" height="74" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <rect x="12" y="10" width="135" height="18" rx="4" fill="#64748b" />
      <text x="79" y="23" text-anchor="middle" class="badge-text" fill="#ffffff">ORGANIZATION SECRETS</text>
      <text x="12" y="46" class="text-sm">Configured by Enterprise / Org admins.</text>
      <text x="12" y="62" class="text-sm" fill="#475569">Inherited by all or selected repos (e.g. shared Docker Hub token).</text>
    </g>

    <!-- Down arrow -->
    <path d="M 230 128 L 230 138 M 226 134 L 230 138 L 234 134" stroke="#94a3b8" stroke-width="2" fill="none" />

    <!-- Secrets Tier 2: Repo -->
    <g transform="translate(15, 142)">
      <rect width="430" height="74" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <rect x="12" y="10" width="125" height="18" rx="4" fill="#0284c7" />
      <text x="74" y="23" text-anchor="middle" class="badge-text" fill="#ffffff">REPOSITORY SECRETS</text>
      <text x="12" y="46" class="text-sm">Configured in Repo Settings &#8594; Secrets and Variables.</text>
      <text x="12" y="62" class="text-sm" fill="#475569">Available to all workflows in this repository: <tspan font-family="monospace">${{ secrets.API_KEY }}</tspan></text>
    </g>

    <!-- Down arrow -->
    <path d="M 230 218 L 230 228 M 226 224 L 230 228 L 234 224" stroke="#94a3b8" stroke-width="2" fill="none" />

    <!-- Secrets Tier 3: Environment -->
    <g transform="translate(15, 232)">
      <rect width="430" height="90" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
      <rect x="12" y="10" width="145" height="18" rx="4" fill="#2563eb" />
      <text x="84" y="23" text-anchor="middle" class="badge-text" fill="#ffffff">ENVIRONMENT SECRETS</text>
      <text x="12" y="46" class="text-sm"><tspan font-weight="700">Highest Security Tier</tspan>: Bound strictly to an Environment.</text>
      <text x="12" y="62" class="text-sm" fill="#1e40af">Unlocked ONLY after protection rules (manual approval) pass!</text>
      <text x="12" y="78" class="text-code" fill="#1e40af">environment: production  # Overrides repo secrets!</text>
    </g>

    <!-- Auto Masking Banner -->
    <g transform="translate(15, 332)">
      <rect width="430" height="156" rx="6" fill="#0f172a" />
      <text x="15" y="24" font-family="monospace" font-size="12" fill="#ef4444"># Built-In Log Redaction &amp; Masking</text>
      <text x="15" y="44" class="text-sm" fill="#cbd5e1">GitHub Actions automatically scrubs registered secrets</text>
      <text x="15" y="60" class="text-sm" fill="#cbd5e1">from all public build logs, replacing them with <tspan fill="#facc15" font-weight="bold">***</tspan>.</text>

      <rect x="15" y="72" width="400" height="70" rx="4" fill="#1e293b" />
      <text x="25" y="94" class="text-code" fill="#94a3b8">$ echo "Database pass is ${{ secrets.DB_PASS }}"</text>
      <text x="25" y="112" class="text-code" fill="#4ade80">Console Output: <tspan fill="#facc15">Database pass is ***</tspan></text>
      <text x="25" y="130" class="text-sm" fill="#94a3b8">Prevents accidental credential leakage in stdout!</text>
    </g>
  </g>

  <!-- COLUMN 2: Environments & Contexts -->
  <g transform="translate(510, 85)">
    <rect width="460" height="505" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect width="460" height="42" rx="10" fill="#f0fdf4" />
    <path d="M 0 32 L 0 42 L 460 42 L 460 32 Z" fill="#f0fdf4" />
    <circle cx="24" cy="21" r="10" fill="#16a34a" />
    <text x="24" y="25" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">&#9989;</text>
    <text x="44" y="26" class="section-title">Environments &amp; Context Evaluation</text>

    <!-- Environment Protection Rules -->
    <g transform="translate(15, 52)">
      <rect width="430" height="210" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="20" class="card-title">Production Environment Protection Rules</text>

      <!-- Rule 1: Manual Approvers -->
      <g transform="translate(12, 32)">
        <rect width="406" height="50" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
        <circle cx="20" cy="25" r="8" fill="#eab308" />
        <text x="20" y="29" text-anchor="middle" font-size="10" fill="#ffffff">&#9873;</text>
        <text x="36" y="20" class="text-sm" font-weight="700" fill="#0f172a">1. Required Reviewers (Manual Approval Gate)</text>
        <text x="36" y="38" class="text-sm" fill="#475569">Pipeline pauses until designated Leads / SREs approve in UI.</text>
      </g>

      <!-- Rule 2: Wait timer -->
      <g transform="translate(12, 88)">
        <rect width="406" height="50" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
        <circle cx="20" cy="25" r="8" fill="#3b82f6" />
        <text x="20" y="29" text-anchor="middle" font-size="10" fill="#ffffff">&#9201;</text>
        <text x="36" y="20" class="text-sm" font-weight="700" fill="#0f172a">2. Wait Timer (Bake Period)</text>
        <text x="36" y="38" class="text-sm" fill="#475569">Mandatory cool-off delay (e.g. 15 mins) before deploy begins.</text>
      </g>

      <!-- Rule 3: Deployment branch -->
      <g transform="translate(12, 144)">
        <rect width="406" height="54" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
        <circle cx="20" cy="25" r="8" fill="#10b981" />
        <text x="20" y="29" text-anchor="middle" font-size="10" fill="#ffffff">&#9881;</text>
        <text x="36" y="20" class="text-sm" font-weight="700" fill="#0f172a">3. Deployment Branches Policy</text>
        <text x="36" y="38" class="text-sm" fill="#475569">Only code from protected <tspan font-family="monospace">main</tspan> can access production.</text>
      </g>
    </g>

    <!-- Context Reference Box -->
    <g transform="translate(15, 274)">
      <rect width="430" height="214" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="12" y="20" class="card-title">Core Context Evaluation Cheat Sheet</text>

      <g transform="translate(12, 32)">
        <rect width="406" height="30" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
        <text x="10" y="20" class="text-code" font-weight="600" fill="#1e40af">${{ github.sha }} / .ref</text>
        <text x="215" y="20" class="text-sm" fill="#475569">&#8594; Current Git commit &amp; branch</text>
      </g>

      <g transform="translate(12, 68)">
        <rect width="406" height="30" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
        <text x="10" y="20" class="text-code" font-weight="600" fill="#1e40af">${{ secrets.DEPLOY_KEY }}</text>
        <text x="215" y="20" class="text-sm" fill="#475569">&#8594; Encrypted credentials</text>
      </g>

      <g transform="translate(12, 104)">
        <rect width="406" height="30" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
        <text x="10" y="20" class="text-code" font-weight="600" fill="#1e40af">${{ vars.API_ENDPOINT }}</text>
        <text x="215" y="20" class="text-sm" fill="#475569">&#8594; Non-sensitive config vars</text>
      </g>

      <g transform="translate(12, 140)">
        <rect width="406" height="30" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
        <text x="10" y="20" class="text-code" font-weight="600" fill="#1e40af">${{ runner.os }} / .arch</text>
        <text x="215" y="20" class="text-sm" fill="#475569">&#8594; Host environment metadata</text>
      </g>

      <g transform="translate(12, 176)">
        <rect width="406" height="30" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
        <text x="10" y="20" class="text-code" font-weight="600" fill="#1e40af">${{ steps.step_id.outputs }}</text>
        <text x="215" y="20" class="text-sm" fill="#475569">&#8594; Step output variables</text>
      </g>
    </g>
  </g>
</svg>

