<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #475569; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1e293b; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .text-sm { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #334155; }
      .text-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 11px; fill: #0f172a; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; }
    </style>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" fill="#f8fafc" />

  <!-- Title Header -->
  <rect x="30" y="25" width="6" height="42" fill="url(#headerGrad)" rx="3" />
  <text x="48" y="44" class="title">CI/CD Lifecycle &amp; GitHub Actions Core Architecture</text>
  <text x="48" y="63" class="subtitle">Continuous Integration, Continuous Delivery vs Deployment, and the Workflow-Job-Step hierarchy</text>

  <!-- LEFT COLUMN: The CI/CD Lifecycle -->
  <g transform="translate(30, 85)">
    <rect width="420" height="505" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect width="420" height="42" rx="10" fill="#eff6ff" />
    <path d="M 0 32 L 0 42 L 420 42 L 420 32 Z" fill="#eff6ff" />
    <circle cx="24" cy="21" r="10" fill="#2563eb" />
    <text x="24" y="25" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">&#8734;</text>
    <text x="44" y="26" class="section-title">The Modern CI/CD Pipeline Stages</text>

    <!-- Stage 1: Continuous Integration -->
    <g transform="translate(15, 55)">
      <rect width="390" height="110" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" />
      <rect x="12" y="10" width="150" height="20" rx="4" fill="#22c55e" />
      <text x="87" y="24" text-anchor="middle" class="badge-text" fill="#ffffff">CONTINUOUS INTEGRATION</text>
      <text x="12" y="48" class="card-title">1. Automated Build &amp; Verification</text>
      <text x="12" y="66" class="text-sm">&#8226; <tspan font-weight="600">Trigger</tspan>: Developer creates PR or pushes commit</text>
      <text x="12" y="82" class="text-sm">&#8226; <tspan font-weight="600">Actions</tspan>: Code checkout, dependencies install, linting</text>
      <text x="12" y="98" class="text-sm">&#8226; <tspan font-weight="600">Testing</tspan>: Unit tests, integration tests, security scanning</text>
    </g>

    <!-- Down arrow -->
    <path d="M 210 168 L 210 178 M 206 174 L 210 178 L 214 174" stroke="#94a3b8" stroke-width="2" fill="none" />

    <!-- Stage 2: Continuous Delivery -->
    <g transform="translate(15, 182)">
      <rect width="390" height="120" rx="6" fill="#fefce8" stroke="#fde047" stroke-width="1.2" />
      <rect x="12" y="10" width="145" height="20" rx="4" fill="#eab308" />
      <text x="84" y="24" text-anchor="middle" class="badge-text" fill="#0f172a">CONTINUOUS DELIVERY</text>
      <text x="12" y="48" class="card-title">2. Package, Stage &amp; Manual Gate</text>
      <text x="12" y="66" class="text-sm">&#8226; <tspan font-weight="600">Package</tspan>: Build containers, compile binaries &amp; artifacts</text>
      <text x="12" y="82" class="text-sm">&#8226; <tspan font-weight="600">Deploy Staging</tspan>: Auto-deploy to Staging / QA environment</text>
      <text x="12" y="98" class="text-sm">&#8226; <tspan font-weight="600">Manual Approval Gate</tspan>: Human click or sign-off before Prod</text>
      <text x="12" y="112" class="text-sm" fill="#854d0e">&#8594; Code is ALWAYS in a deployable, releasable state</text>
    </g>

    <!-- Down arrow -->
    <path d="M 210 305 L 210 315 M 206 311 L 210 315 L 214 311" stroke="#94a3b8" stroke-width="2" fill="none" />

    <!-- Stage 3: Continuous Deployment -->
    <g transform="translate(15, 319)">
      <rect width="390" height="110" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2" />
      <rect x="12" y="10" width="165" height="20" rx="4" fill="#8b5cf6" />
      <text x="94" y="24" text-anchor="middle" class="badge-text" fill="#ffffff">CONTINUOUS DEPLOYMENT</text>
      <text x="12" y="48" class="card-title">3. Fully Automated Production Release</text>
      <text x="12" y="66" class="text-sm">&#8226; <tspan font-weight="600">Zero Human Intervention</tspan>: Every green PR goes to Prod</text>
      <text x="12" y="82" class="text-sm">&#8226; <tspan font-weight="600">Rollout Strategies</tspan>: Canary releases, Blue/Green deploy</text>
      <text x="12" y="98" class="text-sm">&#8226; <tspan font-weight="600">Observability</tspan>: Automated health probes and rollbacks</text>
    </g>

    <!-- Comparison Note -->
    <g transform="translate(15, 439)">
      <rect width="390" height="52" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="12" y="20" class="text-sm" font-weight="700" fill="#0f172a">Continuous Delivery vs. Deployment:</text>
      <text x="12" y="38" class="text-sm" fill="#475569">Delivery = Manual gate/approval. Deployment = 100% automated.</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: GitHub Actions Structural Hierarchy -->
  <g transform="translate(480, 85)">
    <rect width="490" height="505" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect width="490" height="42" rx="10" fill="#f8fafc" />
    <path d="M 0 32 L 0 42 L 490 42 L 490 32 Z" fill="#f8fafc" />
    <circle cx="24" cy="21" r="10" fill="#0f172a" />
    <text x="24" y="25" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">&#9881;</text>
    <text x="44" y="26" class="section-title">GitHub Actions Component Anatomy</text>

    <!-- 1. Event / Trigger -->
    <g transform="translate(15, 55)">
      <rect width="460" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <rect x="12" y="12" width="60" height="26" rx="4" fill="#64748b" />
      <text x="42" y="29" text-anchor="middle" class="badge-text" fill="#ffffff">EVENT</text>
      <text x="82" y="24" class="card-title">on: [push, pull_request, workflow_dispatch]</text>
      <text x="82" y="40" class="text-sm" fill="#64748b">Pipeline triggers: Git push, PR, cron schedule, manual dispatch</text>
    </g>

    <!-- Down arrow -->
    <path d="M 245 106 L 245 116 M 241 112 L 245 116 L 249 112" stroke="#94a3b8" stroke-width="2" fill="none" />

    <!-- 2. Workflow -->
    <g transform="translate(15, 118)">
      <rect width="460" height="50" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
      <rect x="12" y="12" width="80" height="26" rx="4" fill="#2563eb" />
      <text x="52" y="29" text-anchor="middle" class="badge-text" fill="#ffffff">WORKFLOW</text>
      <text x="102" y="24" class="card-title">.github/workflows/*.yml</text>
      <text x="102" y="40" class="text-sm" fill="#1e40af">Automated pipeline of one or more jobs defined in YAML</text>
    </g>

    <!-- Down arrow -->
    <path d="M 245 169 L 245 179 M 241 175 L 245 179 L 249 175" stroke="#94a3b8" stroke-width="2" fill="none" />

    <!-- 3. Jobs (Parallel vs Sequential) -->
    <g transform="translate(15, 182)">
      <rect width="460" height="150" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <rect x="12" y="10" width="55" height="22" rx="4" fill="#0284c7" />
      <text x="39" y="25" text-anchor="middle" class="badge-text" fill="#ffffff">JOBS</text>
      <text x="75" y="25" class="card-title">Set of steps executed on a fresh Runner</text>
      <text x="12" y="48" class="text-sm" fill="#475569">&#9888; Jobs run in <tspan font-weight="700">PARALLEL</tspan> by default unless ordered with <tspan font-family="monospace" font-weight="600">needs:</tspan></text>

      <!-- Sub Job 1 & 2 cards -->
      <rect x="12" y="58" width="210" height="82" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
      <text x="22" y="76" class="text-code" font-weight="700" fill="#0369a1">job: build_and_test</text>
      <text x="22" y="94" class="text-sm">runs-on: ubuntu-latest</text>
      <text x="22" y="110" class="text-sm">&#8594; Fresh clean VM</text>
      <text x="22" y="126" class="text-sm">&#8594; Generates artifact</text>

      <!-- Arrow -->
      <path d="M 226 99 L 236 99 M 232 96 L 236 99 L 232 102" stroke="#64748b" stroke-width="1.5" fill="none" />

      <rect x="240" y="58" width="208" height="82" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
      <text x="250" y="76" class="text-code" font-weight="700" fill="#0369a1">job: deploy_prod</text>
      <text x="250" y="94" class="text-sm">needs: build_and_test</text>
      <text x="250" y="110" class="text-sm">&#8594; Waits for green tests</text>
      <text x="250" y="126" class="text-sm">&#8594; Deploys to cloud</text>
    </g>

    <!-- Down arrow -->
    <path d="M 245 334 L 245 344 M 241 340 L 245 344 L 249 340" stroke="#94a3b8" stroke-width="2" fill="none" />

    <!-- 4. Steps & Actions -->
    <g transform="translate(15, 347)">
      <rect width="460" height="142" rx="6" fill="#fdf4ff" stroke="#f0abfc" stroke-width="1.2" />
      <rect x="12" y="10" width="130" height="22" rx="4" fill="#c026d3" />
      <text x="77" y="25" text-anchor="middle" class="badge-text" fill="#ffffff">STEPS &amp; ACTIONS</text>
      <text x="150" y="25" class="card-title">Sequential execution inside the job</text>

      <rect x="12" y="40" width="436" height="42" rx="4" fill="#ffffff" stroke="#e879f9" stroke-width="1" />
      <text x="22" y="58" class="text-code" fill="#701a75">1. uses: actions/checkout@v4</text>
      <text x="22" y="74" class="text-sm" fill="#86198f">&#8594; Action: Reusable Marketplace step cloning Git repo</text>

      <rect x="12" y="88" width="436" height="42" rx="4" fill="#ffffff" stroke="#e879f9" stroke-width="1" />
      <text x="22" y="106" class="text-code" fill="#701a75">2. run: npm test / pytest</text>
      <text x="22" y="122" class="text-sm" fill="#86198f">&#8594; Shell Command: Direct terminal execution on runner</text>
    </g>
  </g>
</svg>

