<svg xmlns="http://www.w3.org/2000/svg" width="780" height="340" viewBox="0 0 780 340" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Actions workflow directory</title>
  <desc id="desc">A repository contains a .github directory with a workflows subdirectory that contains workflow YAML files such as ci.yml and release.yml.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #24292f; }
      .folder { fill: #ddf4ff; stroke: #0969da; stroke-width: 2; rx: 9; }
      .file { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; rx: 6; }
      .label { font-size: 16px; font-weight: 700; }
      .path { font-family: monospace; font-size: 13px; fill: #57606a; }
    </style>
  </defs>
  <rect width="780" height="340" rx="14" fill="#ffffff"/>
  <text x="390" y="34" text-anchor="middle" font-size="21" font-weight="700">Where GitHub Actions workflows live</text>

  <rect x="36" y="105" width="180" height="96" fill="#f6f8fa" stroke="#8c959f" stroke-width="2" rx="10"/>
  <text class="label" x="126" y="145" text-anchor="middle">Repository root</text>
  <text class="path" x="126" y="172" text-anchor="middle">my-project/</text>

  <path d="M216 153 H258" stroke="#57606a" stroke-width="2"/>
  <path d="M258 87 V253" stroke="#57606a" stroke-width="2"/>
  <path d="M258 110 H287" stroke="#57606a" stroke-width="2"/>
  <path d="M258 228 H287" stroke="#57606a" stroke-width="2"/>

  <rect class="folder" x="290" y="75" width="190" height="70"/>
  <text class="label" x="385" y="106" text-anchor="middle">.github/</text>
  <text class="path" x="385" y="128" text-anchor="middle">directory</text>

  <path d="M480 110 H516" stroke="#57606a" stroke-width="2"/>
  <rect class="folder" x="520" y="75" width="220" height="70"/>
  <text class="label" x="630" y="106" text-anchor="middle">workflows/</text>
  <text class="path" x="630" y="128" text-anchor="middle">required location</text>

  <rect class="file" x="290" y="193" width="190" height="70"/>
  <text class="label" x="385" y="224" text-anchor="middle">src/ and other files</text>
  <text class="path" x="385" y="246" text-anchor="middle">project content</text>

  <path d="M630 145 V174" stroke="#57606a" stroke-width="2"/>
  <path d="M540 174 H720" stroke="#57606a" stroke-width="2"/>
  <path d="M540 174 V193" stroke="#57606a" stroke-width="2"/>
  <path d="M720 174 V193" stroke="#57606a" stroke-width="2"/>
  <rect class="file" x="500" y="193" width="145" height="70"/>
  <text class="label" x="572" y="224" text-anchor="middle">ci.yml</text>
  <text class="path" x="572" y="246" text-anchor="middle">workflow</text>
  <rect class="file" x="655" y="193" width="115" height="70"/>
  <text class="label" x="712" y="224" text-anchor="middle">release.yml</text>
  <text class="path" x="712" y="246" text-anchor="middle">workflow</text>

  <text x="390" y="308" text-anchor="middle" font-size="14" font-weight="700" fill="#cf222e">Use .github/workflows/ (plural), not .github/workflow/</text>
</svg>
