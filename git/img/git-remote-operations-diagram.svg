<svg width="680" height="370" viewBox="0 0 680 370" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="680" height="370" fill="#ffffff" rx="10"/>

  <defs>
    <!-- Arrowhead markers -->
    <marker id="rem-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#0969da"/>
    </marker>
    <marker id="rem-purple" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#8250df"/>
    </marker>
    <marker id="rem-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#1a7f37"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#24292f">Git Remote Operations (Local vs. Cloud)</text>

  <!-- ── LOCAL MACHINE BOUNDARY ── -->
  <rect x="20" y="42" width="300" height="230" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4" rx="8"/>
  <text x="35" y="64" font-size="11.5" font-weight="bold" fill="#0f172a">&#128187; Local Developer Machine</text>

  <!-- Working Directory box -->
  <rect x="35" y="80" width="125" height="85" fill="#ffffff" stroke="#cf222e" stroke-width="1.5" rx="5"/>
  <text x="97" y="100" text-anchor="middle" font-size="10" font-weight="bold" fill="#cf222e">Working Directory</text>
  <text x="97" y="118" text-anchor="middle" font-size="9" fill="#57606a">Active source files</text>
  <text x="97" y="134" text-anchor="middle" font-size="9" fill="#57606a">where you edit code</text>

  <!-- Local Repository box -->
  <rect x="180" y="80" width="125" height="85" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5" rx="5"/>
  <text x="242" y="100" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a7f37">Local Repo (.git)</text>
  <text x="242" y="118" text-anchor="middle" font-size="9" fill="#57606a">HEAD branch (main)</text>
  <text x="242" y="134" text-anchor="middle" font-size="9" font-family="monospace" fill="#1a7f37">origin/main tracking</text>

  <!-- Local internal arrow: commit -->
  <line x1="160" y1="122" x2="175" y2="122" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#rem-green)"/>
  <text x="168" y="115" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#1a7f37">commit</text>

  <!-- SSH Key Authentication badge -->
  <rect x="35" y="180" width="270" height="75" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="5"/>
  <text x="48" y="200" font-size="9.5" font-weight="bold" fill="#0f172a">&#128273; Authentication Methods:</text>
  <text x="48" y="218" font-size="9" fill="#57606a">&#8226; <tspan font-weight="bold" fill="#0969da">SSH Key</tspan> (~/.ssh/id_ed25519) &#8212; Recommended &amp; Passwordless</text>
  <text x="48" y="235" font-size="9" fill="#57606a">&#8226; <tspan font-weight="bold" fill="#0969da">Personal Access Token (PAT)</tspan> &#8212; Over HTTPS</text>

  <!-- ── REMOTE CLOUD BOUNDARY ── -->
  <rect x="470" y="42" width="190" height="230" fill="#f0f6ff" stroke="#0969da" stroke-width="1.5" rx="8"/>
  <text x="565" y="66" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0969da">&#9729; Remote Server</text>
  <text x="565" y="82" text-anchor="middle" font-size="9.5" fill="#57606a">GitHub / GitLab / Bitbucket</text>

  <rect x="485" y="96" width="160" height="155" fill="#ffffff" stroke="#0969da" stroke-width="1.2" rx="6"/>
  <text x="565" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#0969da">Remote Repo: "origin"</text>
  <line x1="485" y1="128" x2="645" y2="128" stroke="#d0d7de" stroke-width="1"/>
  <text x="500" y="148" font-size="9.5" font-family="monospace" fill="#24292f">&#8226; refs/heads/main</text>
  <text x="500" y="168" font-size="9.5" font-family="monospace" fill="#24292f">&#8226; refs/heads/feature</text>
  <text x="500" y="190" font-size="9" fill="#57606a">Team shared store</text>
  <text x="500" y="206" font-size="9" fill="#57606a">Pull Requests &amp; CI/CD</text>
  <rect x="495" y="220" width="140" height="22" fill="#dafbe1" rx="3"/>
  <text x="565" y="235" text-anchor="middle" font-size="9" font-weight="bold" fill="#166534">Upstream Target</text>

  <!-- ── INTERACTION ARROWS ── -->
  <!-- 1. git push -->
  <line x1="305" y1="95" x2="480" y2="120" stroke="#0969da" stroke-width="2" marker-end="url(#rem-blue)"/>
  <rect x="345" y="88" width="95" height="18" fill="#ddf4ff" stroke="#0969da" stroke-width="0.8" rx="3"/>
  <text x="392" y="101" text-anchor="middle" font-size="9" font-family="monospace" font-weight="bold" fill="#0969da">git push (upload)</text>

  <!-- 2. git fetch -->
  <line x1="485" y1="145" x2="310" y2="135" stroke="#8250df" stroke-width="1.8" marker-end="url(#rem-purple)"/>
  <rect x="345" y="132" width="95" height="18" fill="#fcf8ff" stroke="#8250df" stroke-width="0.8" rx="3"/>
  <text x="392" y="145" text-anchor="middle" font-size="9" font-family="monospace" font-weight="bold" fill="#8250df">git fetch (sync)</text>

  <!-- 3. git pull (fetch + merge to workspace) -->
  <path d="M 485 165 C 410 185, 230 195, 140 170" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#rem-blue)"/>
  <rect x="330" y="172" width="125" height="18" fill="#ffebe9" stroke="#cf222e" stroke-width="0.8" rx="3"/>
  <text x="392" y="185" text-anchor="middle" font-size="8.5" font-family="monospace" font-weight="bold" fill="#cf222e">git pull (fetch+merge)</text>

  <!-- ── BOTTOM SUMMARY CHEAT SHEET ── -->
  <rect x="20" y="285" width="640" height="72" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="6"/>
  <text x="35" y="304" font-size="10.5" font-weight="bold" fill="#0f172a">Remote Workflow Commands:</text>
  <text x="35" y="322" font-size="9.5" fill="#57606a">&#8226; <tspan font-family="monospace" font-weight="bold" fill="#0f172a">git clone &lt;url&gt;</tspan> &#8212; Copies remote repository, history, branches, and sets origin</text>
  <text x="35" y="338" font-size="9.5" fill="#57606a">&#8226; <tspan font-family="monospace" font-weight="bold" fill="#0f172a">git remote add origin &lt;url&gt;</tspan> &#8212; Links an existing local repository to remote server</text>
  <text x="35" y="352" font-size="9.5" fill="#57606a">&#8226; <tspan font-family="monospace" font-weight="bold" fill="#0f172a">git push -u origin &lt;branch&gt;</tspan> &#8212; Uploads commits and sets upstream tracking reference</text>
</svg>
