<svg width="580" height="290" viewBox="0 0 580 290" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="580" height="290" fill="#ffffff" rx="10"/>

  <!-- ── LAPTOP A ── -->
  <text x="118" y="28" text-anchor="middle" font-size="12" font-weight="bold" fill="#24292f">Dev Laptop A</text>
  <rect x="10" y="38" width="216" height="148" fill="#fff" stroke="#d73a49" stroke-width="2" rx="6"/>
  <!-- file content -->
  <text x="26" y="65"  font-size="11" font-family="monospace" fill="#24292f">project007/</text>
  <text x="38" y="84"  font-size="11" font-family="monospace" fill="#57606a">file1  v1, v2</text>
  <text x="38" y="102" font-size="11" font-family="monospace" fill="#57606a">file2  v1, v2</text>
  <!-- divider -->
  <line x1="10" y1="115" x2="226" y2="115" stroke="#f0d0d0" stroke-width="1"/>
  <!-- tool label -->
  <text x="26" y="134" font-size="10.5" font-weight="bold" fill="#d73a49">install local vcs tool</text>
  <text x="26" y="152" font-size="10.5" fill="#d73a49">OS  (sccs)</text>

  <!-- ── NO CONNECTION INDICATOR ── -->
  <!-- left dashed line -->
  <line x1="226" y1="112" x2="262" y2="112" stroke="#d73a49" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>
  <!-- right dashed line -->
  <line x1="318" y1="112" x2="354" y2="112" stroke="#d73a49" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>
  <!-- circle -->
  <circle cx="290" cy="112" r="28" fill="#fff0f0" stroke="#d73a49" stroke-width="2"/>
  <!-- X mark -->
  <line x1="272" y1="94"  x2="308" y2="130" stroke="#d73a49" stroke-width="3" stroke-linecap="round"/>
  <line x1="308" y1="94"  x2="272" y2="130" stroke="#d73a49" stroke-width="3" stroke-linecap="round"/>
  <!-- label -->
  <text x="290" y="155" text-anchor="middle" font-size="10" fill="#d73a49" font-weight="bold">No Link</text>

  <!-- ── LAPTOP B ── -->
  <text x="462" y="28" text-anchor="middle" font-size="12" font-weight="bold" fill="#24292f">Dev Laptop B</text>
  <rect x="354" y="38" width="216" height="148" fill="#fff" stroke="#d73a49" stroke-width="2" rx="6"/>
  <!-- file content -->
  <text x="370" y="65"  font-size="11" font-family="monospace" fill="#24292f">project007/</text>
  <text x="382" y="84"  font-size="11" font-family="monospace" fill="#57606a">file1  v1, v2</text>
  <text x="382" y="102" font-size="11" font-family="monospace" fill="#57606a">file2  v1, v2</text>
  <!-- divider -->
  <line x1="354" y1="115" x2="570" y2="115" stroke="#f0d0d0" stroke-width="1"/>
  <!-- tool label -->
  <text x="370" y="134" font-size="10.5" font-weight="bold" fill="#d73a49">install local vcs tool</text>
  <text x="370" y="152" font-size="10.5" fill="#d73a49">OS  (sccs)</text>

  <!-- ── NOTES BOX ── -->
  <rect x="10" y="205" width="560" height="75" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.2" rx="6"/>
  <text x="26" y="225" font-size="11" font-weight="bold" fill="#7d4e00">&#9888; Version tracking is done ONLY on the local dev machine</text>
  <text x="26" y="244" font-size="11" fill="#cf222e">&#10007;  Lose all version history if the machine/laptop crashes</text>
  <text x="26" y="263" font-size="11" fill="#cf222e">&#10007;  Collaboration between multiple devs is not possible</text>

</svg>

