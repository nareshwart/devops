<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="680" height="340" fill="#ffffff" rx="10"/>

  <defs>
    <!-- Arrowhead forward -->
    <marker id="cmd-fwd" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#0969da"/>
    </marker>
    <!-- Arrowhead backward -->
    <marker id="cmd-rev" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#cf222e"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#24292f">Essential Git Commands Flow</text>

  <!-- 1. WORKING DIRECTORY -->
  <rect x="30" y="50" width="160" height="150" fill="#fff" stroke="#cf222e" stroke-width="1.8" rx="6"/>
  <text x="110" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#cf222e">Working Directory</text>
  <line x1="30" y1="84" x2="190" y2="84" stroke="#fecdd3" stroke-width="1"/>
  <text x="42" y="106" font-size="10" font-family="monospace" fill="#0f172a">file.txt (untracked)</text>
  <text x="42" y="126" font-size="10" font-family="monospace" fill="#64748b">file.txt (modified)</text>
  <rect x="40" y="145" width="140" height="36" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="4"/>
  <text x="110" y="160" text-anchor="middle" font-size="9" font-weight="bold" fill="#475569">Inspection Command</text>
  <text x="110" y="173" text-anchor="middle" font-size="10" font-family="monospace" fill="#0969da">git status / diff</text>

  <!-- 2. STAGING AREA -->
  <rect x="260" y="50" width="160" height="150" fill="#fff" stroke="#d97706" stroke-width="1.8" rx="6"/>
  <text x="340" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#d97706">Staging Area</text>
  <line x1="260" y1="84" x2="420" y2="84" stroke="#fde68a" stroke-width="1"/>
  <text x="272" y="106" font-size="10" font-family="monospace" fill="#0f172a">file.txt (staged)</text>
  <text x="272" y="126" font-size="9.5" fill="#64748b">Snapshot ready in RAM</text>
  <rect x="270" y="145" width="140" height="36" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="4"/>
  <text x="340" y="160" text-anchor="middle" font-size="9" font-weight="bold" fill="#475569">Review Staged Changes</text>
  <text x="340" y="173" text-anchor="middle" font-size="10" font-family="monospace" fill="#0969da">git diff --staged</text>

  <!-- 3. LOCAL REPOSITORY -->
  <rect x="490" y="50" width="160" height="150" fill="#fff" stroke="#1a7f37" stroke-width="1.8" rx="6"/>
  <text x="570" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a7f37">Local Repo (.git)</text>
  <line x1="490" y1="84" x2="650" y2="84" stroke="#bbf7d0" stroke-width="1"/>
  <text x="502" y="106" font-size="10" font-family="monospace" fill="#0f172a">Commit: a1b2c3d</text>
  <text x="502" y="126" font-size="9.5" fill="#64748b">Permanent disk snapshot</text>
  <rect x="500" y="145" width="140" height="36" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="4"/>
  <text x="570" y="160" text-anchor="middle" font-size="9" font-weight="bold" fill="#475569">View History Log</text>
  <text x="570" y="173" text-anchor="middle" font-size="10" font-family="monospace" fill="#0969da">git log --oneline</text>

  <!-- FORWARD COMMANDS -->
  <!-- git add -->
  <line x1="190" y1="100" x2="254" y2="100" stroke="#0969da" stroke-width="2" marker-end="url(#cmd-fwd)"/>
  <text x="222" y="93" text-anchor="middle" font-size="9.5" font-family="monospace" font-weight="bold" fill="#0969da">git add</text>

  <!-- git commit -->
  <line x1="420" y1="100" x2="484" y2="100" stroke="#0969da" stroke-width="2" marker-end="url(#cmd-fwd)"/>
  <text x="452" y="93" text-anchor="middle" font-size="9.5" font-family="monospace" font-weight="bold" fill="#0969da">git commit</text>

  <!-- REVERSE COMMAND: unstage -->
  <line x1="254" y1="125" x2="196" y2="125" stroke="#cf222e" stroke-width="1.8" stroke-dasharray="3,2" marker-end="url(#cmd-rev)"/>
  <text x="225" y="138" text-anchor="middle" font-size="8" font-family="monospace" fill="#cf222e">restore --staged</text>

  <!-- BOTTOM SUMMARY -->
  <rect x="30" y="220" width="620" height="95" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="6"/>
  <text x="45" y="242" font-size="11" font-weight="bold" fill="#0f172a">Quick Reference:</text>
  <text x="45" y="262" font-size="10" fill="#475569">&#8226; <tspan font-family="monospace" font-weight="bold" fill="#0f172a">git init</tspan> &#8212; Creates the hidden .git directory to initialize version tracking</text>
  <text x="45" y="280" font-size="10" fill="#475569">&#8226; <tspan font-family="monospace" font-weight="bold" fill="#0f172a">git status</tspan> &#8212; Informs you which files are untracked, modified, or staged</text>
  <text x="45" y="298" font-size="10" fill="#475569">&#8226; <tspan font-family="monospace" font-weight="bold" fill="#0f172a">git log</tspan> &#8212; Displays history of commits (commit ID hash, author, date, message)</text>
</svg>
