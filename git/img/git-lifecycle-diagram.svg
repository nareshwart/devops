<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="680" height="340" fill="#ffffff" rx="10"/>

  <defs>
    <!-- Arrowhead markers -->
    <marker id="flow-fwd" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#0969da"/>
    </marker>
    <marker id="flow-rev" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#cf222e"/>
    </marker>
    <marker id="flow-loop" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#8250df"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="26" text-anchor="middle" font-size="13" font-weight="bold" fill="#24292f">Git File States &amp; Command Lifecycle</text>

  <!-- 1. UNTRACKED -->
  <rect x="25" y="55" width="130" height="135" fill="#fff" stroke="#64748b" stroke-width="1.8" rx="6"/>
  <text x="90" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">Untracked</text>
  <line x1="25" y1="88" x2="155" y2="88" stroke="#e2e8f0" stroke-width="1"/>
  <text x="35" y="108" font-size="9.5" fill="#64748b">New file created</text>
  <text x="35" y="124" font-size="9.5" fill="#64748b">in workspace.</text>
  <text x="35" y="146" font-size="9" font-family="monospace" fill="#cf222e">git status (red)</text>
  <text x="35" y="162" font-size="9" fill="#94a3b8">Git ignores changes</text>

  <!-- Arrow: Untracked to Staged (git add) -->
  <line x1="155" y1="105" x2="198" y2="105" stroke="#0969da" stroke-width="2" marker-end="url(#flow-fwd)"/>
  <text x="177" y="98" text-anchor="middle" font-size="9" font-family="monospace" font-weight="bold" fill="#0969da">git add</text>

  <!-- 2. STAGED -->
  <rect x="205" y="55" width="130" height="135" fill="#fff" stroke="#d97706" stroke-width="1.8" rx="6"/>
  <text x="270" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#d97706">Staged</text>
  <line x1="205" y1="88" x2="335" y2="88" stroke="#fde68a" stroke-width="1"/>
  <text x="215" y="108" font-size="9.5" fill="#92400e">Snapshot prepared</text>
  <text x="215" y="124" font-size="9.5" fill="#92400e">in index buffer.</text>
  <text x="215" y="146" font-size="9" font-family="monospace" fill="#16a34a">git status (green)</text>
  <text x="215" y="162" font-size="9" fill="#94a3b8">Ready for commit</text>

  <!-- Arrow: Staged to Committed (git commit) -->
  <line x1="335" y1="105" x2="378" y2="105" stroke="#0969da" stroke-width="2" marker-end="url(#flow-fwd)"/>
  <text x="357" y="98" text-anchor="middle" font-size="9" font-family="monospace" font-weight="bold" fill="#0969da">git commit</text>

  <!-- 3. UNMODIFIED (COMMITTED) -->
  <rect x="385" y="55" width="130" height="135" fill="#fff" stroke="#1a7f37" stroke-width="1.8" rx="6"/>
  <text x="450" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a7f37">Unmodified</text>
  <line x1="385" y1="88" x2="515" y2="88" stroke="#bbf7d0" stroke-width="1"/>
  <text x="395" y="108" font-size="9.5" fill="#15803d">Clean state.</text>
  <text x="395" y="124" font-size="9.5" fill="#15803d">Saved in .git repo.</text>
  <text x="395" y="146" font-size="9" font-family="monospace" fill="#15803d">HEAD commit</text>
  <text x="395" y="162" font-size="9" fill="#94a3b8">Working tree clean</text>

  <!-- Arrow: Edit file (Unmodified -> Modified) -->
  <line x1="515" y1="105" x2="558" y2="105" stroke="#8250df" stroke-width="2" marker-end="url(#flow-loop)"/>
  <text x="537" y="98" text-anchor="middle" font-size="9" font-weight="bold" fill="#8250df">edit file</text>

  <!-- 4. MODIFIED -->
  <rect x="565" y="55" width="100" height="135" fill="#fff" stroke="#cf222e" stroke-width="1.8" rx="6"/>
  <text x="615" y="78" text-anchor="middle" font-size="11" font-weight="bold" fill="#cf222e">Modified</text>
  <line x1="565" y1="88" x2="665" y2="88" stroke="#fecdd3" stroke-width="1"/>
  <text x="573" y="108" font-size="9.5" fill="#be123c">Changes made</text>
  <text x="573" y="124" font-size="9.5" fill="#be123c">to tracked file.</text>
  <text x="573" y="146" font-size="9" font-family="monospace" fill="#cf222e">not staged</text>
  <text x="573" y="162" font-size="9" fill="#94a3b8">git diff shows</text>

  <!-- Curve: Modified back to Staged (git add) -->
  <path d="M 615 190 C 615 225, 270 225, 270 196" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#flow-fwd)"/>
  <text x="440" y="218" text-anchor="middle" font-size="9.5" font-family="monospace" font-weight="bold" fill="#0969da">git add (re-stage modified file)</text>

  <!-- Unstage line: Staged back to Modified / Untracked -->
  <path d="M 270 55 C 270 40, 160 40, 100 48" fill="none" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#flow-rev)"/>
  <text x="185" y="44" text-anchor="middle" font-size="8.5" font-family="monospace" fill="#cf222e">git restore --staged</text>

  <!-- Bottom Summary Card -->
  <rect x="25" y="240" width="640" height="85" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="6"/>
  <text x="40" y="260" font-size="11" font-weight="bold" fill="#0f172a">Commands Cheat Sheet:</text>
  <text x="40" y="278" font-size="10" fill="#475569">&#8226; <tspan font-family="monospace" font-weight="bold" fill="#0f172a">git status</tspan> &#8212; Inspect whether files are Untracked, Staged, or Modified</text>
  <text x="40" y="296" font-size="10" fill="#475569">&#8226; <tspan font-family="monospace" font-weight="bold" fill="#0f172a">git diff</tspan> &#8212; Compare Modified vs Staged | <tspan font-family="monospace" font-weight="bold" fill="#0f172a">git diff --staged</tspan> &#8212; Compare Staged vs HEAD</text>
  <text x="40" y="314" font-size="10" fill="#475569">&#8226; <tspan font-family="monospace" font-weight="bold" fill="#0f172a">git log --oneline</tspan> &#8212; View concise commit history with commit IDs</text>
</svg>

