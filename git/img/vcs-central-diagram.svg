<svg width="580" height="410" viewBox="0 0 580 410" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <rect width="580" height="410" fill="#ffffff" rx="10"/>

  <defs>
    <!-- forward arrowhead (marker-end) -->
    <marker id="c-fwd" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#0969da"/>
    </marker>
    <!-- reverse arrowhead (marker-start — points backward along line) -->
    <marker id="c-rev" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#0969da"/>
    </marker>
  </defs>

  <!-- ── REMOTE SERVER ── -->
  <text x="290" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#24292f">Remote Server</text>
  <rect x="172" y="30" width="236" height="132" fill="#fff" stroke="#d73a49" stroke-width="2" rx="6"/>
  <text x="290" y="57"  text-anchor="middle" font-size="11" font-family="monospace" fill="#24292f">project007/</text>
  <text x="290" y="75"  text-anchor="middle" font-size="11" font-family="monospace" fill="#57606a">file1  v1, v2, v3</text>
  <text x="290" y="93"  text-anchor="middle" font-size="11" font-family="monospace" fill="#57606a">file2  v1, v2, v3</text>
  <line x1="172" y1="105" x2="408" y2="105" stroke="#f0d0d0" stroke-width="1"/>
  <text x="290" y="122" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#d73a49">install centralized vcs tool</text>
  <text x="290" y="140" text-anchor="middle" font-size="10.5" fill="#d73a49">OS  (svn / tfs / cvs)</text>
  <!-- box bottom = y:162 -->

  <!-- ── BIDIRECTIONAL ARROWS ── -->
  <!-- left: server ↕ Laptop A   midpoint≈(164,206)  angle≈-35° -->
  <line x1="228" y1="162" x2="100" y2="250"
        stroke="#0969da" stroke-width="1.8"
        marker-start="url(#c-rev)" marker-end="url(#c-fwd)"/>
  <text x="164" y="208" text-anchor="middle" font-size="10" font-weight="bold" fill="#0969da"
        transform="rotate(-35, 164, 208)">push / pull</text>

  <!-- right: server ↕ Laptop B   midpoint≈(416,206)  angle≈+35° -->
  <line x1="352" y1="162" x2="480" y2="250"
        stroke="#0969da" stroke-width="1.8"
        marker-start="url(#c-rev)" marker-end="url(#c-fwd)"/>
  <text x="416" y="208" text-anchor="middle" font-size="10" font-weight="bold" fill="#0969da"
        transform="rotate(35, 416, 208)">push / pull</text>

  <!-- ── LAPTOP A ── -->
  <text x="100" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#24292f">Dev Laptop A</text>
  <rect x="10" y="255" width="180" height="88" fill="#fff" stroke="#d73a49" stroke-width="1.5" rx="6"/>
  <text x="26" y="278" font-size="11" font-family="monospace" fill="#24292f">project007/</text>
  <text x="38" y="296" font-size="11" font-family="monospace" fill="#57606a">file1</text>
  <text x="38" y="314" font-size="11" font-family="monospace" fill="#57606a">file2</text>

  <!-- ── LAPTOP B ── -->
  <text x="480" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#24292f">Dev Laptop B</text>
  <rect x="390" y="255" width="180" height="88" fill="#fff" stroke="#d73a49" stroke-width="1.5" rx="6"/>
  <text x="406" y="278" font-size="11" font-family="monospace" fill="#24292f">project007/</text>
  <text x="418" y="296" font-size="11" font-family="monospace" fill="#57606a">file1</text>
  <text x="418" y="314" font-size="11" font-family="monospace" fill="#57606a">file2</text>

  <!-- ── NOTES ── -->
  <rect x="10" y="358" width="560" height="44" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.2" rx="6"/>
  <text x="26" y="376" font-size="11" font-weight="bold" fill="#116329">&#10003;  Version tracking always on remote server — collaboration problem solved</text>
  <text x="26" y="394" font-size="11" fill="#cf222e">&#10007;  Server loss = all history gone  |  &#10007;  Network required to work / create versions</text>

</svg>
